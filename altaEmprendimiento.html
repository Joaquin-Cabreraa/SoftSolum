<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Emprendimiento</title>
    <link rel="stylesheet" th:href="@{/css/umnatural.css}" href="/css/umnatural.css">
</head>
<body>
<div class="layout">

    <aside class="hero" style="--foto: url('/images/uruguay-emprendimiento.jpg')">
        <div class="hero-text">
            <small>Experiencias que conectan</small>
            <h2>Descubrí Uruguay de otra manera.</h2>
        </div>
    </aside>

    <main class="content">
        <div class="logo">UM<span>natural</span></div>

        <div class="inner">
            <p class="eyebrow">Registro de prestadores</p>
            <h1>Formá parte de UMnatural.</h1>
            <p class="lead">Registrate para ofrecer tus actividades y conectar con personas que buscan nuevas experiencias.</p>

            <form action="/api/v1/emprendimiento/new" method="POST">

                <h2 class="seccion">Datos del emprendimiento</h2>

                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="fila">
                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" name="telefono">
                    </div>
                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email">
                    </div>
                </div>

                <div class="campo">
                    <label for="ubicacion">Ubicación</label>
                    <input type="text" id="ubicacion" name="ubicacion">
                </div>

                <div class="campo">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion"></textarea>
                </div>

                <h2 class="seccion">Actividades</h2>

                <div id="actividades">

                <div class="actividad">
                    <h3>Actividad 1</h3>

                    <div class="campo">
                        <label>Estado</label>
                        <input type="text" name="actividades[0].estado" required>
                    </div>

                    <div class="fila">
                        <div class="campo">
                            <label>Departamento</label>
                            <input type="text" name="actividades[0].departamento">
                        </div>
                        <div class="campo">
                            <label>Localidad</label>
                            <input type="text" name="actividades[0].localidad">
                        </div>
                    </div>

                    <div class="fila">
                        <div class="campo">
                            <label>Duración (minutos)</label>
                            <input type="number" name="actividades[0].duracionMinutos" min="1">
                        </div>
                        <div class="campo">
                            <label>Precio</label>
                            <input type="number" name="actividades[0].precio" step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label>Requisitos de edad</label>
                        <input type="text" name="actividades[0].requisitosEdad">
                    </div>

                    <div class="campo">
                        <label>Mínimo de días previos para reservar</label>
                        <input type="number" name="actividades[0].minPreviosReservar" min="0" required>
                    </div>
                </div>

                </div>

                <button type="button" class="agregar" onclick="agregarActividad()">
                    + Agregar otra actividad
                </button>

                <button type="submit" class="guardar">
                    Guardar emprendimiento y actividades
                </button>

            </form>
        </div>
    </main>
</div>

<script>

    let contador = 1;

    function agregarActividad() {

        const actividades = document.getElementById("actividades");

        const actividad = document.createElement("div");

        actividad.classList.add("actividad");

        actividad.innerHTML = `
            <h3>Actividad ${contador + 1}</h3>

            <div class="campo">
                <label>Estado</label>
                <input type="text" name="actividades[${contador}].estado" required>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>Departamento</label>
                    <input type="text" name="actividades[${contador}].departamento">
                </div>
                <div class="campo">
                    <label>Localidad</label>
                    <input type="text" name="actividades[${contador}].localidad">
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>Duración (minutos)</label>
                    <input type="number" name="actividades[${contador}].duracionMinutos" min="1">
                </div>
                <div class="campo">
                    <label>Precio</label>
                    <input type="number" name="actividades[${contador}].precio" step="0.01" min="0" required>
                </div>
            </div>

            <div class="campo">
                <label>Requisitos de edad</label>
                <input type="text" name="actividades[${contador}].requisitosEdad">
            </div>

            <div class="campo">
                <label>Mínimo de días previos para reservar</label>
                <input type="number" name="actividades[${contador}].minPreviosReservar" min="0" required>
            </div>

            <button type="button" class="eliminar" onclick="this.parentElement.remove()">
                Eliminar actividad
            </button>
        `;

        actividades.appendChild(actividad);

        contador++;
    }

</script>
</body>
</html>
