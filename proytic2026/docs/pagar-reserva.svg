<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1244" width="1300" height="1244" font-family="Arial, sans-serif" font-size="12.5">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1b2a41"/></marker><marker id="x" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1,1 L9,9 M9,1 L1,9" stroke="#b9483a" stroke-width="2"/></marker></defs>
<rect width="1300" height="1244" fill="#ffffff"/>
<text x="650.0" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a41">Diagrama de secuencia: Pagar reserva (CU-T07)</text>
<rect x="40" y="270" width="1220" height="62" fill="#fdf3ec" fill-opacity="0.55" stroke="#e0713a" stroke-width="1.3"/>
<text x="48" y="286" font-weight="bold" fill="#c95f2b">alt  datos inválidos / reserva cancelada, vencida o ya pagada</text>
<rect x="40" y="554" width="1220" height="650" fill="#fdf3ec" fill-opacity="0.55" stroke="#e0713a" stroke-width="1.3"/>
<text x="48" y="570" font-weight="bold" fill="#c95f2b">alt  tarjeta ...1111  -&gt;  APROBADO</text>
<line x1="40" y1="776" x2="1260" y2="776" stroke="#e0713a" stroke-dasharray="6 4"/>
<text x="48" y="792" font-weight="bold" fill="#c95f2b">else  tarjeta ...2222  -&gt;  RECHAZADO</text>
<line x1="40" y1="1002" x2="1260" y2="1002" stroke="#e0713a" stroke-dasharray="6 4"/>
<text x="48" y="1018" font-weight="bold" fill="#c95f2b">else  ...3333 (timeout)  o  pasarela caída (5xx)</text>
<line x1="90" y1="130" x2="90" y2="1230" stroke="#9aa3ad" stroke-dasharray="5 4"/>
<rect x="10" y="60" width="160" height="40" rx="6" fill="#1b2a41"/>
<text x="90" y="80" text-anchor="middle" fill="#fff" font-weight="bold">Turista</text>
<line x1="280" y1="130" x2="280" y2="1230" stroke="#9aa3ad" stroke-dasharray="5 4"/>
<rect x="200" y="60" width="160" height="40" rx="6" fill="#1b2a41"/>
<text x="280" y="80" text-anchor="middle" fill="#fff" font-weight="bold">PagoWebController</text>
<line x1="500" y1="130" x2="500" y2="1230" stroke="#9aa3ad" stroke-dasharray="5 4"/>
<rect x="420" y="60" width="160" height="40" rx="6" fill="#1b2a41"/>
<text x="500" y="80" text-anchor="middle" fill="#fff" font-weight="bold">PagoService</text>
<line x1="730" y1="130" x2="730" y2="1230" stroke="#9aa3ad" stroke-dasharray="5 4"/>
<rect x="650" y="60" width="160" height="40" rx="6" fill="#1b2a41"/>
<text x="730" y="80" text-anchor="middle" fill="#fff" font-weight="bold">Base de datos</text>
<line x1="940" y1="130" x2="940" y2="1230" stroke="#9aa3ad" stroke-dasharray="5 4"/>
<rect x="860" y="60" width="160" height="40" rx="6" fill="#1b2a41"/>
<text x="940" y="80" text-anchor="middle" fill="#fff" font-weight="bold">PasarelaClient</text>
<line x1="1160" y1="130" x2="1160" y2="1230" stroke="#9aa3ad" stroke-dasharray="5 4"/>
<rect x="1080" y="60" width="160" height="54" rx="6" fill="#1b2a41"/>
<text x="1160" y="80" text-anchor="middle" fill="#fff" font-weight="bold">Pasarela</text>
<text x="1160" y="94" text-anchor="middle" fill="#fff" font-weight="bold">(/pasarela/pagar)</text>
<line x1="90" y1="174" x2="278" y2="174" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="185.0" y="169" text-anchor="middle" fill="#1b2a41">POST /panel/turista/reservas/{id}/pagar (tarjeta, venc., CVV)</text>
<line x1="280" y1="208" x2="498" y2="208" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="390.0" y="203" text-anchor="middle" fill="#1b2a41">validarReservaPagable() y validarTarjeta()</text>
<line x1="500" y1="242" x2="282" y2="242" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="390.0" y="237" text-anchor="middle" fill="#1b2a41">mensaje de error o null</text>
<line x1="280" y1="308" x2="92" y2="308" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="185.0" y="303" text-anchor="middle" fill="#1b2a41">mensaje de error (NO se llama a la pasarela)</text>
<line x1="280" y1="356" x2="498" y2="356" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="390.0" y="351" text-anchor="middle" fill="#1b2a41">pagar(turistaId, reservaId, tarjeta, venc., cvv)</text>
<line x1="500" y1="390" x2="728" y2="390" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="615.0" y="385" text-anchor="middle" fill="#1b2a41">SELECT reserva FOR UPDATE (bloqueo anti doble cobro)</text>
<line x1="730" y1="424" x2="502" y2="424" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="615.0" y="419" text-anchor="middle" fill="#1b2a41">reserva (PENDIENTE_PAGO)</text>
<rect x="506" y="446" width="213" height="22" fill="#fff6bf" stroke="#d9c75a"/>
<text x="512" y="461">monto = precio x cupos (RNE #11)</text>
<line x1="500" y1="492" x2="938" y2="492" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="720.0" y="487" text-anchor="middle" fill="#1b2a41">cobrar(tarjeta, venc., cvv, monto)</text>
<line x1="940" y1="526" x2="1158" y2="526" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="1050.0" y="521" text-anchor="middle" fill="#1b2a41">POST /pasarela/pagar  (RestClient, timeout 3 s)</text>
<line x1="1160" y1="592" x2="942" y2="592" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="1050.0" y="587" text-anchor="middle" fill="#1b2a41">200 {APROBADO, código}</text>
<line x1="940" y1="626" x2="502" y2="626" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="720.0" y="621" text-anchor="middle" fill="#1b2a41">RespuestaPasarela</text>
<line x1="500" y1="660" x2="728" y2="660" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="615.0" y="655" text-anchor="middle" fill="#1b2a41">INSERT Pago (APROBADO, últimos 4, código)</text>
<line x1="500" y1="694" x2="728" y2="694" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="615.0" y="689" text-anchor="middle" fill="#1b2a41">UPDATE reserva: estado = CONFIRMADA</text>
<line x1="500" y1="728" x2="282" y2="728" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="390.0" y="723" text-anchor="middle" fill="#1b2a41">Pago APROBADO</text>
<line x1="280" y1="762" x2="92" y2="762" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="185.0" y="757" text-anchor="middle" fill="#1b2a41">"Pago aprobado, tu reserva quedó confirmada"</text>
<line x1="1160" y1="818" x2="942" y2="818" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="1050.0" y="813" text-anchor="middle" fill="#1b2a41">200 {RECHAZADO, fondos insuficientes}</text>
<line x1="940" y1="852" x2="502" y2="852" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="720.0" y="847" text-anchor="middle" fill="#1b2a41">RespuestaPasarela</text>
<line x1="500" y1="886" x2="728" y2="886" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="615.0" y="881" text-anchor="middle" fill="#1b2a41">INSERT Pago (RECHAZADO)</text>
<rect x="506" y="908" width="206" height="22" fill="#fff6bf" stroke="#d9c75a"/>
<text x="512" y="923">la reserva sigue PENDIENTE_PAGO</text>
<line x1="500" y1="954" x2="282" y2="954" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="390.0" y="949" text-anchor="middle" fill="#1b2a41">Pago RECHAZADO</text>
<line x1="280" y1="988" x2="92" y2="988" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="185.0" y="983" text-anchor="middle" fill="#1b2a41">"Pago rechazado... podés reintentar hasta las HH:mm"</text>
<line x1="940" y1="1044" x2="502" y2="1044" stroke="#b9483a" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#x)"/>
<text x="720.0" y="1039" text-anchor="middle" fill="#b9483a">ResourceAccessException (timeout / 503)</text>
<line x1="500" y1="1078" x2="728" y2="1078" stroke="#1b2a41" stroke-width="1.4" marker-end="url(#a)"/>
<text x="615.0" y="1073" text-anchor="middle" fill="#1b2a41">INSERT Pago (ERROR, sin código)</text>
<rect x="506" y="1100" width="293" height="22" fill="#fff6bf" stroke="#d9c75a"/>
<text x="512" y="1115">la reserva sigue PENDIENTE_PAGO; no se rompe</text>
<line x1="500" y1="1146" x2="282" y2="1146" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="390.0" y="1141" text-anchor="middle" fill="#1b2a41">Pago ERROR</text>
<line x1="280" y1="1180" x2="92" y2="1180" stroke="#1b2a41" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="185.0" y="1175" text-anchor="middle" fill="#1b2a41">"El servicio de pagos no respondió... reintentá"</text>
</svg>