spring.application.name=proytic2026

# Base H2 en archivo: los datos no se pierden al reiniciar
spring.datasource.url=jdbc:h2:file:./data/proytic
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Admin inicial (se crea solo si no existe ninguno)
admin.inicial.nombre=Admin
admin.inicial.apellido=Umnatural
admin.inicial.email=admin@umnatural.uy
admin.inicial.password=${ADMIN_PASSWORD:admin123}
