spring.application.name=proytic2026

# Base neon
spring.datasource.url=jdbc:postgresql://ep-snowy-salad-b5565vac.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update


# Admin inicial (se crea solo si no existe ninguno)
admin.inicial.nombre=Admin
admin.inicial.apellido=Umnatural
admin.inicial.email=admin@umnatural.uy
admin.inicial.password=${ADMIN_PASSWORD:admin123}

# Fotos de las actividades (hasta 6 por actividad, 5 MB cada una)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=32MB

# Mercado Pago (credenciales de PRUEBA). Cada uno las pone como variables de entorno,
# igual que DB_PASSWORD. Si no están, la app usa una pasarela simulada.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}

# Dirección pública para los links de los códigos QR (ej. http://192.168.1.20:8080 para abrirlos
# desde un celular en la misma red). Si no se pone, se usa la dirección con la que se entró.
app.url-publica=${APP_URL:}

# ----------------------------------------
# Correo electrónico - Mailtrap Sandbox
# ----------------------------------------

# Habilitar el servicio de correo solo cuando esté configurado
umnatural.mail.enabled=${MAIL_ENABLED:false}
umnatural.mail.from=${MAIL_FROM:umnatural2026@gmail.com}

# Servidor SMTP de pruebas
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587

# Credenciales de Mailtrap (variables de entorno)
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Seguridad de la conexión SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Evitar esperas indefinidas si Mailtrap no responde
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
