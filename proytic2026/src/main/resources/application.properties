spring.application.name=proytic2026

# Base neon
spring.datasource.url=jdbc:postgresql://ep-snowy-salad-b5565vac.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update


# Admin inicial (se crea solo si no existe ninguno)
admin.inicial.nombre=Admin
admin.inicial.apellido=Umnatural
admin.inicial.email=admin@umnatural.uy
admin.inicial.password=${ADMIN_PASSWORD:admin123}


# Pasarela de pagos (simulada, vive en esta misma app en /pasarela/pagar)
# En producción cambiar pasarela.url por el host real (o definir la variable PASARELA_URL).
pasarela.url=${PASARELA_URL:http://localhost:${server.port:8080}}
pasarela.timeout-ms=3000
# Demora de la tarjeta ...3333: tiene que ser mayor que el timeout
pasarela.simulada.demora-ms=6000
