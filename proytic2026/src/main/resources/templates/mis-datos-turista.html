<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMnatural | Mis datos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/umnatural.css">
    <style>
        .volver { display: table; font-size: 15px; color: var(--muted); text-decoration: none; margin-bottom: 22px; }
        .columnas { display: grid; grid-template-columns: 1fr 340px; gap: 30px; align-items: start; margin-top: 26px; }
        .campo { margin-bottom: 14px; }
        .campo label { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: block; }
        .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .ayuda { font-size: 14px; color: var(--muted); margin-top: 4px; }
        .mensaje { padding: 12px 16px; border-radius: 6px; font-size: 17px; margin-top: 20px; }
        .mensaje.ok { background: #e3f1ea; color: #2f7d5b; }
        .mensaje.error { background: #f7e4e1; color: #b9483a; }
        @media (max-width: 850px) { .columnas, .dos { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<nav class="nav">
    <a href="/" class="logo">UM<span>natural</span></a>
    <div class="nav-links">
        <a href="/">Inicio</a>
        <a href="/actividades">Actividades</a>
        <a href="/panel/turista/reservas">Mis reservas</a>
        <a href="/panel/turista" class="activo">Mi panel</a>
        <a href="/logout">Cerrar sesión</a>
    </div>
</nav>

<main class="pagina">
    <a href="/panel/turista" class="volver">← Volver a mi panel</a>
    <span class="eyebrow">Turista</span>
    <h1>Mis datos.</h1>
    <p class="descripcion">Estos datos completan solos la "Persona 1" cuando reservás.</p>

    <div class="mensaje ok" th:if="${exito}" th:text="${exito}">Ok</div>
    <div class="mensaje error" th:if="${error}" th:text="${error}">Error</div>

    <div class="columnas">
        <form class="tarjeta" method="post" action="/panel/turista/datos">
            <h3 style="margin-bottom: 16px">Datos personales</h3>
            <div class="dos">
                <div class="campo"><label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required maxlength="60" th:value="${turista.name}"></div>
                <div class="campo"><label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required maxlength="60" th:value="${turista.lastName}"></div>
            </div>
            <div class="dos">
                <div class="campo"><label for="documento">Documento (CI o pasaporte)</label>
                    <input type="text" id="documento" name="documento" required maxlength="20" th:value="${turista.documento}"></div>
                <div class="campo"><label for="fechaNacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required th:value="${turista.fechaNacimiento}"></div>
            </div>
            <div class="dos">
                <div class="campo"><label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required th:value="${turista.userEmail}">
                    <p class="ayuda">Es con el que iniciás sesión.</p></div>
                <div class="campo"><label for="telefono">Celular</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="099123456" th:value="${turista.telefono}"></div>
            </div>
            <button type="submit" class="boton boton-naranja" style="width: 100%">Guardar cambios</button>
        </form>

        <form class="tarjeta" method="post" action="/panel/turista/datos/contrasena">
            <h3 style="margin-bottom: 16px">Cambiar contraseña</h3>
            <div class="campo"><label for="actual">Contraseña actual</label>
                <input type="password" id="actual" name="actual" required autocomplete="current-password"></div>
            <div class="campo"><label for="nueva">Nueva contraseña</label>
                <input type="password" id="nueva" name="nueva" required minlength="15" autocomplete="new-password"></div>
            <div class="campo"><label for="confirmacion">Repetir la nueva</label>
                <input type="password" id="confirmacion" name="confirmacion" required minlength="15" autocomplete="new-password"></div>
            <button type="submit" class="boton boton-borde" style="width: 100%">Cambiar contraseña</button>
        </form>
    </div>
</main>
<footer>© 2026 UMnatural · Desarrollado por SoftSolum</footer>
</body>
</html>
