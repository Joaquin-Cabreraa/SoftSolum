<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Usuario</title>
    <link rel="stylesheet" th:href="@{/css/umnatural.css}" href="/css/umnatural.css">
</head>
<body>
<div class="layout">

    <aside class="hero" style="--foto: url('/images/uruguay-usuario.jpg')">
        <div class="hero-text">
            <small>Experiencias que conectan</small>
            <h2>Descubrí Uruguay de otra manera.</h2>
        </div>
    </aside>

    <main class="content">
        <div class="logo">UM<span>natural</span></div>

        <div class="inner">
            <p class="eyebrow">Registro de usuarios</p>
            <h1>Creá tu cuenta.</h1>
            <p class="lead">Completá tus datos para empezar a usar UMnatural.</p>

            <form action="/api/v1/usuario/new" method="POST" onsubmit="return verificarPassword()">

                <div class="fila">
                    <div class="campo">
                        <label for="name">Nombre</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="campo">
                        <label for="lastName">Apellido</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="userName">Nombre de usuario</label>
                    <input type="text" id="userName" name="userName" required>
                </div>

                <div class="campo">
                    <label for="userEmail">Correo electrónico</label>
                    <input type="email" id="userEmail" name="userEmail" required>
                </div>

                <div class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" name="telefono">
                </div>

                <div class="campo">
                    <label for="passwordHash">Contraseña</label>
                    <input type="password" id="passwordHash" name="passwordHash" required>
                </div>

                <div class="campo">
                    <label for="confirmarPassword">Repetir contraseña</label>
                    <input type="password" id="confirmarPassword" required autocomplete="new-password" placeholder="Volvé a escribir tu contraseña">
                    <small id="avisoPassword" class="aviso-password" aria-live="polite"></small>
                </div>

                <button type="submit" class="guardar">Guardar usuario</button>

            </form>
        </div>
    </main>
</div>


<script>
    const campoPassword = document.getElementById('passwordHash');
    const campoConfirmar = document.getElementById('confirmarPassword');
    const avisoPassword = document.getElementById('avisoPassword');

    function actualizarAviso() {
        campoConfirmar.classList.remove('valido', 'invalido');
        if (campoConfirmar.value === '') {
            avisoPassword.textContent = '';
            avisoPassword.className = 'aviso-password';
            return;
        }
        if (campoPassword.value === campoConfirmar.value) {
            avisoPassword.textContent = 'Las contraseñas coinciden.';
            avisoPassword.className = 'aviso-password ok';
            campoConfirmar.classList.add('valido');
        } else {
            avisoPassword.textContent = 'Las contraseñas no coinciden.';
            avisoPassword.className = 'aviso-password error';
            campoConfirmar.classList.add('invalido');
        }
    }

    // Si no coinciden, el formulario no se envía
    function verificarPassword() {
        if (campoPassword.value !== campoConfirmar.value) {
            actualizarAviso();
            campoConfirmar.focus();
            return false;
        }
        return true;
    }

    campoPassword.addEventListener('input', actualizarAviso);
    campoConfirmar.addEventListener('input', actualizarAviso);
</script>

</body>
</html>
